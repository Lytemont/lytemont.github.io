<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coin Flipper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="card">
    <header class="header">
      <h1>Coin Flipper</h1>
      <p class="subtitle">Press space or click to flip</p>
    </header>

    <!-- 3D Coin Stage -->
    <div class="coin-stage" id="coinStage">
      <div class="coin" id="coin">
        <div class="coin-face heads">
          <div class="coin-inner">
            <span class="coin-icon">🦅</span>
            <span class="coin-text">HEADS</span>
          </div>
        </div>
        <div class="coin-rim"></div>
        <div class="coin-face tails">
          <div class="coin-inner">
            <span class="coin-icon">👑</span>
            <span class="coin-text">TAILS</span>
          </div>
        </div>
      </div>
      <div class="coin-shadow" id="coinShadow"></div>
    </div>

    <!-- Live Result Display -->
    <div class="result-badge" id="resultBadge">Ready to Flip</div>

    <!-- Action Controls -->
    <div class="controls">
      <button class="btn btn-primary" id="flipBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
        Flip Coin
      </button>
      <button class="btn btn-secondary" id="resetBtn">Reset</button>
    </div>

    <!-- Stats Dashboard -->
    <section class="stats-grid">
      <div class="stat-card">
        <span class="stat-label">Heads</span>
        <span class="stat-value" id="headsCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Tails</span>
        <span class="stat-value" id="tailsCount">0</span>
      </div>
      <div class="stat-card">
        <span class="stat-label">Total Flips</span>
        <span class="stat-value" id="totalCount">0</span>
      </div>
    </section>
  </main>

  <script src="index.js"></script>
</body>
</html>
