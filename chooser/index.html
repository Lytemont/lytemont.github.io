<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0"
		/>
		<title>Finger Chooser & Team Picker</title>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta name="theme-color" content="#0a0b10" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="./index.css" />
		<script type="module" src="./index.js"></script>
	</head>
	<body>
		<canvas id="board"></canvas>

		<div id="instruction-card">
			<p id="description">
				Place your fingers on the screen to choose a winner.
			</p>
		</div>

		<header id="controls">
			<button id="team-mode-toggle" aria-label="Toggle Team Mode">
				<span class="dot"></span>
				<span class="btn-text">Team Mode</span>
			</button>

			<div id="team-count-label" aria-label="Adjust Team Count">
				<span class="label-title">Teams</span>
				<div class="stepper">
					<button id="team-minus" aria-label="Decrease Teams">−</button>
					<span id="team-count">2</span>
					<button id="team-plus" aria-label="Increase Teams">+</button>
				</div>
			</div>
		</header>

		<div id="live-region" aria-live="assertive" class="visually-hidden"></div>

		<footer id="footer-info">
			<p id="version"></p>
			<div id="update-available" hidden>
				Update ready. <a href="#" onclick="location.reload()">Reload</a>
			</div>
		</footer>
	</body>
</html>
